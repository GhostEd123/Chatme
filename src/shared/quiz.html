<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tech Assessment Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6 border-b pb-4">Cardtonic Upskill Assessment</h1>
        
        <div id="quiz-container">
            <div id="question-header" class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-2"></div>
            <div id="question-text" class="text-lg font-medium text-gray-800 mb-6"></div>
            <div id="options-container" class="space-y-3 mb-6"></div>
            
            <div id="feedback-container" class="hidden rounded-lg p-4 mb-6">
                <p id="feedback-title" class="font-bold mb-1"></p>
                <p id="feedback-rationale" class="text-gray-700"></p>
            </div>
            
            <div class="flex justify-between items-center mt-8">
                <span id="score-tracker" class="text-sm text-gray-500 font-medium">Score: 0 / 0</span>
                <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors">
                    Next Question
                </button>
            </div>
        </div>

        <div id="results-container" class="hidden text-center py-10">
            <h2 class="text-3xl font-bold mb-4">Assessment Complete!</h2>
            <p id="final-score" class="text-xl mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg">
                Retake Quiz
            </button>
        </div>
    </div>

    <script>
        // Paste the entirety of "testgorilla-full-practice-bank.md" inside these backticks
        const rawData = `
## 1. Git & GitHub
**Q1.** You are working on a feature branch and realize a specific commit introduces a bug. You want to undo the changes of that specific commit without modifying commit history, so the rest of the team can pull safely. Which command should you use?
a. git reset --hard <commit-hash>
b. git revert <commit-hash>
c. git checkout <commit-hash>
d. git rebase -i HEAD~3

# Answer Key & Rationales
### Git & GitHub
**Q1: b.** git revert creates a new commit undoing the change without rewriting history — safe for shared branches.
        `; // *Note: I have truncated the markdown here for brevity. Replace with your full 108-question file.*

        // Minimal parser for demonstration (Requires structured markdown)
        // For a fully robust implementation, we define the JSON structure directly:
        const questions = [
            {
                category: "Git & GitHub",
                question: "You are working on a feature branch and realize a specific commit introduces a bug. You want to undo the changes of that specific commit without modifying commit history, so the rest of the team can pull safely. Which command should you use?",
                options: [
                    "a. git reset --hard <commit-hash>",
                    "b. git revert <commit-hash>",
                    "c. git checkout <commit-hash>",
                    "d. git rebase -i HEAD~3"
                ],
                correctAnswer: 1, // index of 'b'
                rationale: "git revert creates a new commit undoing the change without rewriting history — safe for shared branches."
            },
            {
                category: "Data Structures & Algorithms",
                question: "A function must check if a string of parentheses, brackets, and braces is strictly balanced. Which structure is best suited?",
                options: [
                    "a. Queue",
                    "b. Hash Map",
                    "c. Stack",
                    "d. Linked List"
                ],
                correctAnswer: 2, // index of 'c'
                rationale: "Stack (LIFO) naturally matches nested bracket matching."
            }
            // Add the rest of the 108 questions following this object structure
        ];

        let currentIndex = 0;
        let score = 0;

        const questionHeader = document.getElementById('question-header');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackRationale = document.getElementById('feedback-rationale');
        const nextBtn = document.getElementById('next-btn');
        const scoreTracker = document.getElementById('score-tracker');

        function loadQuestion() {
            const q = questions[currentIndex];
            questionHeader.textContent = `${q.category} — Question ${currentIndex + 1} of ${questions.length}`;
            questionText.textContent = q.question;
            optionsContainer.innerHTML = '';
            feedbackContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 border rounded-lg hover:bg-gray-100 transition-colors option-btn";
                btn.textContent = opt;
                btn.onclick = () => handleSelection(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleSelection(selectedIndex, selectedBtn) {
            const q = questions[currentIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            
            // Disable all buttons after selection
            allBtns.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-gray-100');
            });

            // Check if correct
            const isCorrect = selectedIndex === q.correctAnswer;
            
            if (isCorrect) {
                score++;
                selectedBtn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                feedbackTitle.textContent = "✅ Correct!";
                feedbackTitle.className = "font-bold mb-1 text-green-700";
                feedbackContainer.className = "bg-green-50 border border-green-200 rounded-lg p-4 mb-6 block";
            } else {
                selectedBtn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                allBtns[q.correctAnswer].classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'ring-2', 'ring-green-500');
                feedbackTitle.textContent = "❌ Incorrect";
                feedbackTitle.className = "font-bold mb-1 text-red-700";
                feedbackContainer.className = "bg-red-50 border border-red-200 rounded-lg p-4 mb-6 block";
            }

            scoreTracker.textContent = `Score: ${score} / ${currentIndex + 1}`;
            feedbackRationale.textContent = q.rationale;
            nextBtn.classList.remove('hidden');
        }

        nextBtn.onclick = () => {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('results-container').classList.remove('hidden');
                document.getElementById('final-score').textContent = `You scored ${score} out of ${questions.length}!`;
            }
        };

        // Initialize first question
        loadQuestion();
    </script>
</body>
</html>
